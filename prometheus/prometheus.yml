global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "scheduler"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["scheduler-main-app-1:3000"]
  
  
  - job_name: "traefik"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["traefik-proxy-01:8082"]